{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="h4 mb-0">Products</div>
</div>

<div class="grid">
  {% for p in products %}
  <div class="product-card card text-center">
    {% if p.image %}
      <img src="{{ p.image }}" alt="{{ p.name }}">
    {% else %}
      <div class="placeholder">No image</div>
    {% endif %}
    <div class="pname">{{ p.name }}</div>
    <div class="price">₹{{ '%.2f'|format(p.price) }}</div>
    {% if p.is_deleted %}
      <div class="sold-ribbon"><span>SOLD OUT</span></div>
      <div class="sold-overlay">Sold Out</div>
    {% else %}
      <div class="mt-2">
        <button class="btn btn-sm btn-primary add-to-cart" data-id="{{ p.id }}" title="Add to cart">🛒 Add</button>
      </div>
    {% endif %}
  </div>
  {% endfor %}
</div>

{% endblock %}
