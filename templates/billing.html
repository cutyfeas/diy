{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
  <div class="h4 mb-0">Billing / Invoices</div>
</div>

<section class="card">
  <h2>All Bills</h2>
  <table class="responsive-table">
    <thead><tr><th>Invoice No</th><th>Date</th><th>Customer</th><th>Total (₹)</th><th>Actions</th></tr></thead>
    <tbody>
      {% for b in bills %}
      <tr>
        <td>{{ b.invoice_no }}</td>
        <td>{{ b.date }}</td>
        <td>{{ b.customer_name }}</td>
        <td>₹{{ '%.2f'|format(b.total) }}</td>
        <td>
          <a class="btn btn-sm btn-outline-primary" href="/invoice/{{ b.id }}">View</a>
          <a class="btn btn-sm btn-outline-secondary" href="/billing/edit/{{ b.id }}">Edit</a>
          <form action="/billing/delete/{{ b.id }}" method="post" style="display:inline-block">
            <button class="btn danger" onclick="return confirm('Delete bill?')">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>

{% endblock %}
