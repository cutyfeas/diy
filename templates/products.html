{% extends 'base.html' %}
{% block content %}
<section class="card">
  <form action="/products/add" method="post" enctype="multipart/form-data" class="form-row align-items-end">
    <div class="form-group col-md-5">
      <input name="name" placeholder="Product name" required class="form-control">
    </div>
    <div class="form-group col-md-3">
      <input name="price" placeholder="Price (₹)" required class="form-control">
    </div>
    <div class="form-group col-md-3">
      <input type="file" name="image" accept="image/*" class="form-control-file">
    </div>
    <div class="form-group col-md-1">
      <button class="btn btn-primary w-100">Add</button>
    </div>
  </form>
</section>

<section class="card mt-3">
  <div class="grid">
    {% for p in products %}
      <div class="product-card {% if p.is_deleted %}deleted{% endif %}">
        {% if p.image %}
          <img src="{{ p.image }}" alt="{{ p.name }}">
        {% else %}
          <div class="placeholder">No image</div>
        {% endif %}
        <div class="pname">{{ p.name }}</div>
        <div class="price">₹{{ '%.2f'|format(p.price) }}</div>
        <a class="btn btn-sm btn-outline-secondary mr-1" href="/products/edit/{{ p.id }}">Edit</a>
        <form action="/products/toggle_delete/{{ p.id }}" method="post" style="display:inline-block">
          {% if p.is_deleted %}
            <button class="btn btn-secondary">Restore</button>
          {% else %}
            <button class="btn btn-danger">Delete</button>
          {% endif %}
        </form>
      </div>
    {% endfor %}
  </div>
</section>

{% endblock %}
