{% extends 'base.html' %}
{% block content %}
<div class="card">
  <form action="/products/edit/{{ product.id }}" method="post" enctype="multipart/form-data" class="form-row align-items-end">
    <div class="form-group col-md-5">
      <label>Name</label>
      <input name="name" value="{{ product.name }}" required class="form-control">
    </div>
    <div class="form-group col-md-3">
      <label>Price (₹)</label>
      <input name="price" value="{{ product.price }}" required class="form-control">
    </div>
    <div class="form-group col-md-3">
      <label>Replace Image</label>
      <input type="file" name="image" accept="image/*" class="form-control-file">
    </div>
    <div class="form-group col-md-1">
      <button class="btn btn-primary w-100">Save</button>
    </div>
  </form>
</div>
{% endblock %}
